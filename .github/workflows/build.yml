name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/actions/setup@main

      - name: Build mod
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticksave-windows
          path: |
            build/**/*.geode
            build/**/*.dll
