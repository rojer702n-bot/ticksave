name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform: [ windows-latest ]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v3
      
      - name: Build for Windows
        uses: geode-sdk/actions/build@v3
        with:
          platforms: "windows"

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ticksave-geode
          path: build/**/*.geode
