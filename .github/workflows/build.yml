name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Use the composite 'build' action (handles setup + build internally)
      - name: Build Mod
        uses: geode-sdk/actions/build@main
        with:
          platforms: "windows"
          # Optional: If you have dependencies in 'dependencies.json'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticksave-windows
          path: build/**/*.geode
