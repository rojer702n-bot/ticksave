name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Use the latest stable setup for Geode
      - name: Setup Geode SDK
        uses: geode-sdk/actions/setup@main

      # Build the project manually using CMake
      - name: Build Mod
        run: |
          cmake -B build
          cmake --build build --config Release

      # Upload using v4 (Fixes the deprecation error)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticksave-windows
          path: build/**/*.geode
